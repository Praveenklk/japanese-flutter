name: nihongo_master
description: "Nihongo Master - Learn Japanese from JLPT N5 to N1"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  flutter_animate: ^4.3.0
  google_fonts: ^6.1.0
  smooth_page_indicator: ^1.1.0

  # 🔊 Audio
  audioplayers: ^5.2.1

  # 💾 Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/data/n5_kanji.json
    - assets/data/n5_grammar.json
    - assets/data/n5_vocabulary.json

  # 🔥 FONTS (UPDATED PROPERLY)
  # fonts:
  #   - family: NotoSansJP
  #     fonts:
  #       - asset: assets/fonts/NotoSansJP-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/NotoSansJP-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/NotoSansJP-Bold.ttf
  #         weight: 700


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/image.png"